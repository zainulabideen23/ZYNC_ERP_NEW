name: Keep Heroku Dyno Awake

on:
  schedule:
    - cron: '*/25 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Heroku Health Endpoint
        run: |
          curl -s -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" \
            https://zync-erp-api-9e4287cb53e0.herokuapp.com/api/health || true
      - name: Ping Frontend
        run: |
          curl -s -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" \
            https://zync-erp-new.vercel.app || true
