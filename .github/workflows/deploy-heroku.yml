name: Deploy to Heroku

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Heroku Build
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.HEROKU_API_KEY }}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/vnd.heroku+json; version=3" \
            -d '{"source_blob":{"url":"https://github.com/zainulabideen23/ZYNC_ERP_NEW/archive/main.tar.gz","version":"main"}}' \
            https://api.heroku.com/apps/zync-erp-api/builds
